# Keeps action pins (ci.yml) and pub deps on the latest stable
# without manual version hunting. Security + compat fixes arrive as PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
