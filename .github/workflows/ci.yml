# CI — analyze + test + Android build, all in parallel.
#
# Block flow (how big Android/Flutter shops run it):
#   analyze ─┐
#   test ────┼─► (parallel, ~1/3 wall-clock of sequential)
#   build ───┘         └─► artifacts (debug APK + release AAB)
# Release signing + store deploy are deliberately NOT here:
# they belong in a gated release workflow fed by secrets.
#
# Caching layers (each independent, all opt-in):
#   1. subosito/flutter-action cache:true  → Flutter SDK + pub cache
#   2. gradle/actions/setup-gradle         → Gradle deps + build cache
#      (read-only on PRs so drive-by branches can't evict main's cache)
#
# Toolchain pins (verified 2026-09-24 against upstream tags + compat tables):
#   - actions/checkout@v7, setup-java@v6 (temurin 17), upload-artifact@v7
#   - gradle/actions/setup-gradle@v6, subosito/flutter-action@v2
#   - Flutter 3.44.9 (== local toolchain), Java 17 (AGP 7.3 + Gradle 7.6.3
#     run on 17; AGP 9.x also floors at 17, so this survives upgrades)
# Dependabot (.github/dependabot.yml) keeps the action pins fresh.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/user
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/user
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter test

  backend:
    name: Backend API + live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Boot API and smoke-test the contract
        run: |
          set -e
          DB_PATH="$RUNNER_TEMP/water-ci.db" PORT=3101 bun run src/index.ts &
          SRV=$!
          trap "kill $SRV" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:3101/api/products >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3101/api/products | grep -q '"wd-20l"'
          TOKEN=$(curl -sf -X POST http://localhost:3101/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"phone":"9000000001","password":"Vendor@123"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          test -n "$TOKEN"
          ORDERS=$(curl -sf http://localhost:3101/api/vendor/orders \
            -H "Authorization: Bearer $TOKEN")
          echo "$ORDERS" | grep -qv '"phone"'
          echo "$ORDERS" | grep -qv '"email"'
          echo "smoke OK"

  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/user
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs read main's cache but never overwrite it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release app bundle (debug-signed)
        # Release signing keys live in secrets and are wired in the
        # release workflow; here we prove the release path compiles.
        # build-number tracks the CI run so artifacts stay distinguishable.
        run: >
          flutter build appbundle --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: apps/user/build/app/outputs/flutter-apk/app-debug.apk
          compression-level: 0 # APKs are already compressed
          retention-days: 14
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: apps/user/build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
